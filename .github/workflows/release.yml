name: release

# tag push → linux binary attached to the GitHub release of that tag. this
# repository is public, so a fleet or worker box fetches the asset over plain
# HTTPS and needs no credential of any kind. the etl repo pins the tag it wants
# in the data-desk ETL, so a run uses a release rather than a
# working tree.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # attach the asset to the release

jobs:
  build:
    runs-on: ubuntu-24.04   # must match the fleet box distro (data-desk infra/cloud-init.yaml)
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev clang libclang-dev
      - run: cargo build --release -p s2e-cli
      - name: attach the binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/release/s2e --clobber
